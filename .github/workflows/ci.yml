name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn verify
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Build Docker image
        if: success()
        run: docker build -t ai-receptionist:${{ github.sha }} .

      - name: Push to registry
        if: github.ref == 'refs/heads/main' && success()
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ai-receptionist:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/ai-receptionist:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/ai-receptionist:${{ github.sha }}
