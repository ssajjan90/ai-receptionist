spring:
  application:
    name: ai-receptionist
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    # Runtime connection the app uses for every request. In an environment that provisions a
    # separate non-superuser app_runtime role (docker-compose.yml, AbstractIntegrationTest — see
    # W99 / V8__create_rls_policies.sql), this MUST be that restricted role, not the migration
    # role below, or row-level security silently provides no protection.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aireceptionist}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Migrations need DDL/extension privileges the restricted runtime role above doesn't have, so
    # Flyway gets its own connection. Defaults fall back to the same role as spring.datasource.*
    # (today's behavior, unchanged) unless DB_MIGRATION_USERNAME/PASSWORD are set — docker-compose
    # and the Testcontainers test setup both set them to the privileged table-owning role.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aireceptionist}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    openai:
          api-key: ${SPRING_AI_OPENAI_API_KEY:dummy-key-for-local}
          chat:
            options:
              model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gpt-4o}

app:
  jwt:
    expiry-minutes: 60
    # private-key and public-key are injected from environment variables in each profile.
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
  otp:
    secret: ${OTP_SECRET:change-me-in-production}
    max-verify-attempts: ${OTP_MAX_VERIFY_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:test-verify-token}
    app-secret: ${WHATSAPP_APP_SECRET:test-app-secret}
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v19.0}
    access-token: ${WHATSAPP_ACCESS_TOKEN:test-access-token}
  exotel:
    api-key: ${EXOTEL_API_KEY:test-exotel-api-key}
    api-token: ${EXOTEL_API_TOKEN:test-exotel-api-token}
    shared-secret: ${EXOTEL_SHARED_SECRET:test-exotel-shared-secret}
    sid: ${EXOTEL_SID:test-exotel-sid}
  ocr:
    provider: ${OCR_PROVIDER:google}
  export:
    # HMAC key for hashing WhatsApp message content in tenant data exports (see W111): customer
    # messages are frequently low-entropy ("yes", "ok", a phone number), so a plain unsalted hash
    # is trivially reversible via a dictionary attack. Keying it makes that infeasible without
    # this secret. Must differ per environment; never reuse the local default in production.
    message-hash-secret: ${EXPORT_HASH_SECRET:change-me-in-production}
  cache:
    response-ttl-minutes: 5
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-period-minutes: 1
  dashboard:
    url: ${DASHBOARD_URL:https://app.callsahayak.com/dashboard}

features:
  daily-summary:
    enabled: false

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # /actuator/health is permitAll (SecurityConfig) for load-balancer health checks, so
      # anonymous requests carry no authority and always get the bare UP/DOWN status here —
      # never W6's DB/Redis connection detail leak. An authenticated caller with a granted
      # authority still sees full component details.
      show-details: when-authorized


resilience4j:
  circuitbreaker:
    instances:
      llmService:
        sliding-window-size: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        sliding-window-type: COUNT_BASED
      whatsAppNotificationService:
        sliding-window-size: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        sliding-window-type: COUNT_BASED

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [tenantId=%X{tenantId}] %-5level %logger{36} - %msg%n"
