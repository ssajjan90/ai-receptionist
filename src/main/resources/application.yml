spring:
  application:
    name: ai-receptionist
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aireceptionist}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    openai:
          api-key: ${SPRING_AI_OPENAI_API_KEY:dummy-key-for-local}
          chat:
            options:
              model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gpt-4o}

app:
  jwt:
    expiry-minutes: 60
    # private-key and public-key are injected from environment variables in each profile.
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
  otp:
    secret: ${OTP_SECRET:change-me-in-production}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:test-verify-token}
    app-secret: ${WHATSAPP_APP_SECRET:test-app-secret}
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v19.0}
    access-token: ${WHATSAPP_ACCESS_TOKEN:test-access-token}
  exotel:
    api-key: ${EXOTEL_API_KEY:test-exotel-api-key}
    api-token: ${EXOTEL_API_TOKEN:test-exotel-api-token}
    shared-secret: ${EXOTEL_SHARED_SECRET:test-exotel-shared-secret}
    sid: ${EXOTEL_SID:test-exotel-sid}
  ocr:
    provider: ${OCR_PROVIDER:google}
  cache:
    response-ttl-minutes: 5
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-period-minutes: 1
  dashboard:
    url: ${DASHBOARD_URL:https://app.callsahayak.com/dashboard}

features:
  daily-summary:
    enabled: false

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always


resilience4j:
  circuitbreaker:
    instances:
      llmService:
        sliding-window-size: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        sliding-window-type: COUNT_BASED
      whatsAppNotificationService:
        sliding-window-size: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        sliding-window-type: COUNT_BASED

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [tenantId=%X{tenantId}] %-5level %logger{36} - %msg%n"
